# 网站身份
name: Memex
tagline: "当生活给我橙子"
url: https://AkaCMD.github.io/blog
language: ""
footer: >-
  <div class="footer-body">
    <a class="footer-home" href="https://akacmd.github.io/" title="回到主站" aria-label="回到主站"></a>
    <p class="footer-credits">
      <span>Powered by <a href="https://github.com/rochacbruno/marmite">Marmite</a></span>
      <span><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license">CC BY-NC-SA 4.0</a></span>
    </p>
  </div>

# 内容与显示
content_path: content
templates_path: templates
pagination: 10
default_date_format: "%b %e, %Y"
toc: false
show_next_prev_links: true
enable_related_content: false
# 原生作者 RSS 汇总所有栏目；无需额外的构建后处理。
default_author: trioduckk
authors:
  trioduckk:
    name: 三重鸭
    avatar: static/avatar-placeholder.png

# 导航与文章流
menu:
  - [标签, tags.html]
  - [时间线, archive.html]
  - [旧存档, old-posts.html]
  - [友链, links.html]
  - [关于, about.html]
streams:
  old-posts:
    display_name: 旧存档

# 搜索（暂未启用，保留原有设置）
enable_search: false
search_show_matches: false
search_match_count: 0
search_title: ""

# 外观与图片处理
extra:
  # 友链按名称首字母排列（中文按拼音）；avatar 和 description 可省略。
  friend_links:
    - name: 北依树洞
      url: https://hanax092.xyz
    - name: "dyron503's"
      url: https://blog.dyron503.com/
      avatar: media/friend-links/dyron503.png
    - name: "Feishiko's Site"
      url: https://feishiko.top
      avatar: media/friend-links/feishiko.ico
    - name: iz
      url: https://www.dangoiz.com/
      avatar: media/friend-links/iz.png
    - name: koiro
      url: https://blog.koiro.xyz/
      avatar: media/friend-links/koiro.ico
    - name: rasp505
      url: https://blog.rasp505.top/
      avatar: media/friend-links/rasp505.ico
    - name: 真强悍
      url: https://zqh46656.github.io/blog/
  colormodetoggle: true
  fediverse_verification: https://mastodon.gamedev.place/@cmd_official
  max_image_width: 800
  banner_image_width: 1200
  resize_filter: quality

# 输出与源文件
json_feed: false
publish_md: false
# 模板将仓库根地址与完整的 content/... 路径拼接，保留子目录。
source_repository: https://github.com/AkaCMD/blog/blob/main
build_sitemap: true
publish_urls_json: true

# Marmite 0.4.2 的特殊文件从项目根目录读取；根目录副本每次构建都更新。
file_mapping:
  - source: favicon.ico
    dest: favicon.ico
