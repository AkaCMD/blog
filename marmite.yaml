# 网站身份
name: Memex
tagline: "当生活给我橙子"
url: https://AkaCMD.github.io/blog
language: ""
footer: <div>Powered by <a href="https://github.com/rochacbruno/marmite">Marmite</a> | <small><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC-BY_NC-SA</a></small></div>

# 内容与显示
content_path: content
templates_path: templates
pagination: 10
default_date_format: "%b %e, %Y"
toc: false
show_next_prev_links: true
enable_related_content: false

# 导航与文章流
menu:
  - [标签, tags.html]
  - [时间线, archive.html]
  - [旧存档, old-posts.html]
  - [RSS, index.rss]
  - [关于, about.html]
streams:
  old-posts:
    display_name: 旧存档

# 搜索（暂未启用，保留原有设置）
enable_search: false
search_show_matches: false
search_match_count: 0
search_title: ""

# 外观与图片处理
extra:
  colormodetoggle: true
  fediverse_verification: https://mastodon.gamedev.place/@cmd_official
  max_image_width: 800
  banner_image_width: 1200
  resize_filter: quality

# 输出与源文件
json_feed: false
publish_md: false
source_repository: https://github.com/AkaCMD/blog/blob/main/content
build_sitemap: true
publish_urls_json: true

# Marmite 0.4.2 的特殊文件从项目根目录读取；根目录副本每次构建都更新。
file_mapping:
  - source: favicon.ico
    dest: favicon.ico
