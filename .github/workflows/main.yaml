name: GH Pages Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read locked Marmite version
        id: marmite-version
        run: |
          version="$(bash scripts/marmite.sh --locked-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Marmite binary
        uses: actions/cache@v4
        with:
          path: ~/.local/share/memex-marmite/${{ steps.marmite-version.outputs.version }}/bin/marmite
          key: marmite-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ steps.marmite-version.outputs.version }}-locked-v2

      - name: Install and verify Marmite
        run: bash scripts/marmite.sh --ensure

      - name: Build and validate site
        run: bash scripts/build_site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
